[workspace]
resolver = "3"
members = ["crates/adb", "crates/phone", "crates/phonectl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Daan Hessen"]
repository = "https://github.com/DaanHessen/phonectl"

[workspace.dependencies]
adb = { path = "crates/adb" }
phone = { path = "crates/phone" }

tokio = { version = "1.53", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rsa = { version = "0.9", features = ["sha1", "pem"] }
base64 = "0.22"
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
curve25519-dalek = "4"
hkdf = "0.12"
aes-gcm = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
subtle = "2.6"
mdns-sd = { version = "0.21", default-features = false }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

# RSA key generation in tests is painfully slow unoptimised.
[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
